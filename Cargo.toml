[package]
name = "openvpn-status-rust"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "A fast, asynchronous Rust rewrite of the OpenVPN Status dashboard"
license = "MIT"

[[bin]]
name = "openvpn-status"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["trace", "compression-gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
maxminddb = "0.24"
ipnet = "2"
rust-embed = { version = "8", features = ["mime-guess"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
base64 = "0.22"
subtle = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
